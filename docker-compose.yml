services:
  nexa-crm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexa-crm
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-https://api.makprojetosmake.com.br}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-b2efa885a71ee22edf72b597df1a0ce9}
      - EVOLUTION_INSTANCE=${EVOLUTION_INSTANCE:-agente-ia}
      - SUPABASE_URL=${SUPABASE_URL:-https://pejcssjahomczedjzqzr.supabase.co/rest/v1/}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlamNzc2phaG9tY3plZGp6cXpyIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4OTI1OTg2MiwiZXhwIjoyMTA0ODM1ODYyfQ.VYNhGfHlojrkA7c3TOGTppfzoxty-X9YWEeLiYu4hVw}
    volumes:
      - nexa_data:/app/data
    networks:
      - default

volumes:
  nexa_data:
    name: nexa_crm_data

networks:
  default:
    name: nexa_network
